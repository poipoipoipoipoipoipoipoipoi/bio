<body>

<p><a href="../index.html" target="_blank" class="back-link">← Multi-point Gradient Canvas & About the Pig</a></p>

<h1>Advanced OKLab/OKLCh Gradient Generator</h1>

<div class="controls">
  <button id="add" aria-label="Add new color point">Add Point</button>
  <button id="export-csv">Export CSV</button>
  <button id="export">Export PNG</button>
  <input type="checkbox" id="loopToggle"> 🔁 Loop
</div>

<div id="points"></div>
<canvas id="canvas" width="1000" height="200"></canvas>

<script>
let points = [];
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const w = canvas.width, h = canvas.height;
let loopMode = false;

document.getElementById("loopToggle").onchange = (e) => {
  loopMode = e.target.checked;
  renderPoints();
  drawGradient();
};

function createPoint(color = "#ff0000", position = 0.5, mode = "oklab") {
  const id = Date.now() + Math.random();
  points.push({ id, color, position, mode });
  renderPoints();
  drawGradient();
}

function renderPoints() {
  const container = document.getElementById("points");
  container.innerHTML = "";
  points.sort((a, b) => a.position - b.position);

  points.forEach((pt, i) => {
    const div = document.createElement("div");
    div.className = "point";

    const colorBox = document.createElement("div");
    colorBox.className = "color-box";

    const color = document.createElement("input");
    color.type = "color";
    color.value = pt.color;
    color.oninput = () => { pt.color = color.value; drawGradient(); };

    const del = document.createElement("button");
    del.textContent = "🗑️";
    del.onclick = () => {
      if (points.length > 2) {
        points = points.filter(p => p.id !== pt.id);
        renderPoints();
        drawGradient();
      } else {
        alert("At least two points needed.");
      }
    };

    colorBox.append(color, del);

    const mode = document.createElement("select");
    ["oklab", "oklch-cw", "oklch-ccw"].forEach(m => {
      const opt = document.createElement("option");
      opt.value = m;
      opt.textContent = m;
      if (m === pt.mode) opt.selected = true;
      mode.appendChild(opt);
    });
    mode.onchange = () => { pt.mode = mode.value; drawGradient(); };

    if (i === points.length - 1 && !loopMode) {
      mode.style.display = "none";
    }

    mode.className = "vertical-select";

    div.append(colorBox, mode);
    container.appendChild(div);
  });
}

function srgbToLinear(c) {
  return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
}
function linearToSrgb(c) {
  return c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
}
function hexToRgb(hex) {
  const m = hex.match(/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i);
  return [
    parseInt(m[1], 16) / 255,
    parseInt(m[2], 16) / 255,
    parseInt(m[3], 16) / 255
  ];
}
function rgbToHex(r, g, b) {
  const to255 = v => Math.round(Math.min(1, Math.max(0, v)) * 255);
  return "#" + [r, g, b].map(x => to255(x).toString(16).padStart(2, "0")).join("");
}
function rgbToOklab([r, g, b]) {
  r = srgbToLinear(r); g = srgbToLinear(g); b = srgbToLinear(b);
  const l = 0.4122 * r + 0.5363 * g + 0.0514 * b;
  const m = 0.2119 * r + 0.6807 * g + 0.1074 * b;
  const s = 0.0883 * r + 0.2817 * g + 0.6300 * b;
  const l_ = Math.cbrt(l), m_ = Math.cbrt(m), s_ = Math.cbrt(s);
  return [
    0.2105 * l_ + 0.7936 * m_ - 0.0041 * s_,
    1.978 * l_ - 2.429 * m_ + 0.4506 * s_,
    0.0259 * l_ + 0.7828 * m_ - 0.8087 * s_
  ];
}
function oklabToRgb([L, a, b]) {
  const l_ = L + 0.3963 * a + 0.2158 * b;
  const m_ = L - 0.1056 * a - 0.0639 * b;
  const s_ = L - 0.0895 * a - 1.2915 * b;
  const l = l_ ** 3, m = m_ ** 3, s = s_ ** 3;
  const r = 4.0767 * l - 3.3077 * m + 0.2310 * s;
  const g = -1.2684 * l + 2.6098 * m - 0.3413 * s;
  const b_ = -0.0042 * l - 0.7034 * m + 1.7076 * s;
  return [linearToSrgb(r), linearToSrgb(g), linearToSrgb(b_)];
}
function oklabToOklch([L, a, b]) {
  return [L, Math.sqrt(a * a + b * b), (Math.atan2(b, a) * 180 / Math.PI + 360) % 360];
}
function oklchToOklab([L, C, h]) {
  const hr = h * Math.PI / 180;
  return [L, C * Math.cos(hr), C * Math.sin(hr)];
}
function lerp(a, b, t) { return a + (b - a) * t; }
function lerpHue(h1, h2, t, ccw) {
  let d = h2 - h1;
  if (ccw) { if (d > 0) d -= 360; }
  else { if (d < 0) d += 360; }
  return (h1 + d * t + 360) % 360;
}
function interpolate(c1, c2, steps, mode) {
  const rgb1 = hexToRgb(c1), rgb2 = hexToRgb(c2);
  if (mode === "oklab") {
    const lab1 = rgbToOklab(rgb1), lab2 = rgbToOklab(rgb2);
    return Array.from({ length: steps }, (_, i) => {
      const t = i / (steps - 1);
      const lab = lab1.map((v, j) => lerp(v, lab2[j], t));
      return rgbToHex(...oklabToRgb(lab));
    });
  } else {
    const lch1 = oklabToOklch(rgbToOklab(rgb1));
    const lch2 = oklabToOklch(rgbToOklab(rgb2));
    const ccw = mode === "oklch-ccw";
    return Array.from({ length: steps }, (_, i) => {
      const t = i / (steps - 1);
      const L = lerp(lch1[0], lch2[0], t);
      const C = lerp(lch1[1], lch2[1], t);
      const h = lerpHue(lch1[2], lch2[2], t, ccw);
      return rgbToHex(...oklabToRgb(oklchToOklab([L, C, h])));
    });
  }
}

function drawGradient(showPoints = true) {
  ctx.clearRect(0, 0, w, h);
  const sorted = points.slice().sort((a, b) => a.position - b.position);
  const allColors = [];

  for (let i = 0; i < sorted.length - 1; i++) {
    const p1 = sorted[i], p2 = sorted[i + 1];
    const steps = Math.max(2, Math.floor((p2.position - p1.position) * w));
    const cols = interpolate(p1.color, p2.color, steps, p1.mode);
    cols.forEach((col, j) => {
      allColors.push({
        color: col,
        x: lerp(p1.position, p2.position, j / (cols.length - 1))
      });
    });
  }

  if (loopMode && sorted.length > 1) {
    const p1 = sorted[sorted.length - 1];
    const p2 = sorted[0];
    const steps = Math.max(2, Math.floor((1 - p1.position + p2.position) * w));
    const cols = interpolate(p1.color, p2.color, steps, p1.mode);
    cols.forEach((col, j) => {
      allColors.push({
        color: col,
        x: lerp(p1.position, 1 + p2.position, j / (cols.length - 1)) % 1
      });
    });
  }

  const grad = ctx.createLinearGradient(0, 0, w, 0);
  allColors.forEach(p => grad.addColorStop(p.x, p.color));
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  if (showPoints) {
    sorted.forEach(pt => {
      const x = pt.position * w;
      const y = 15;
      const size = 25;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x - size / 2, 0);
      ctx.lineTo(x + size / 2, 0);
      ctx.closePath();
      ctx.fillStyle = "#ccc";
      ctx.fill();
      ctx.strokeStyle = "#333";
      ctx.lineWidth = 2;
      ctx.stroke();
    });
  }
}

let dragging = null;

canvas.onmousedown = (e) => {
  const x = e.offsetX;
  const nearest = points.reduce((acc, p) => {
    const px = p.position * w;
    const dist = Math.abs(px - x);
    return dist < acc.dist ? { p, dist } : acc;
  }, { p: null, dist: Infinity });

  if (nearest.dist < 12.5) {
    dragging = nearest.p;

    document.onmousemove = (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      dragging.position = Math.min(1, Math.max(0, x / w));
      renderPoints();
      drawGradient();
    };

    document.onmouseup = () => {
      dragging = null;
      document.onmousemove = null;
      document.onmouseup = null;
    };
  }
};

document.getElementById("add").onclick = () => {
  createPoint("#" + Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, "0"), Math.random());
};
function rgbToHsl(r, g, b) {
  r = Math.min(1, Math.max(0, r));
  g = Math.min(1, Math.max(0, g));
  b = Math.min(1, Math.max(0, b));
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  let h, s, l = (max + min) / 2;
  if (max === min) {
    h = s = 0;
  } else {
    const d = max - min;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    switch (max) {
      case r: h = ((g - b) / d + (g < b ? 6 : 0)); break;
      case g: h = ((b - r) / d + 2); break;
      case b: h = ((r - g) / d + 4); break;
    }
    h = h * 60;
  }
  return [Math.round(h), Math.round(s * 100), Math.round(l * 100)];
}

document.getElementById("export-csv").onclick = () => {
  const sorted = points.slice().sort((a, b) => a.position - b.position);
  const allColors = [];

  for (let i = 0; i < sorted.length - 1; i++) {
    const p1 = sorted[i], p2 = sorted[i + 1];
    const steps = Math.max(2, Math.floor((p2.position - p1.position) * w));
    const cols = interpolate(p1.color, p2.color, steps, p1.mode);
    cols.forEach((col, j) => {
      const pos = lerp(p1.position, p2.position, j / (cols.length - 1));
      allColors.push({ position: pos.toFixed(5), color: col });
    });
  }

  if (loopMode && sorted.length > 1) {
    const p1 = sorted[sorted.length - 1];
    const p2 = sorted[0];
    const steps = Math.max(2, Math.floor((1 - p1.position + p2.position) * w));
    const cols = interpolate(p1.color, p2.color, steps, p1.mode);
    cols.forEach((col, j) => {
      const pos = lerp(p1.position, 1 + p2.position, j / (cols.length - 1)) % 1;
      allColors.push({ position: pos.toFixed(5), color: col });
    });
  }

  allColors.sort((a, b) => a.position - b.position);

  let csv = "position,hsl,hex\n" + allColors.map(p => {
    const [r, g, b] = hexToRgb(p.color);
    const [h, s, l] = rgbToHsl(r, g, b);
    return `${p.position},"hsl(${h}, ${s}%, ${l}%)",${p.color}`;
  }).join("\n");

  const blob = new Blob([csv], { type: "text/csv" });
  const link = document.createElement("a");
  link.download = "gradient.csv";
  link.href = URL.createObjectURL(blob);
  link.click();
};

document.getElementById("export").onclick = () => {
  drawGradient(false);
  const link = document.createElement("a");
  link.download = "gradient.png";
  link.href = canvas.toDataURL("image/png");
  link.click();
  drawGradient(true);
};

createPoint("#000000", 1);
createPoint("#28231f", 0);
</script>
