  <title>Find LCM of 2 or More Numbers – Short Division Method (Step-by-Step)</title>

<body>
  <p><a href="../index.html" target="_blank" class="back-link">← Back</a></p>
  <h1>Find LCM of 2 or More Numbers</h1>
  <h2>Short Division Method (Step-by-Step)</h2>
  <p>Enter positive integers separated by commas (e.g. 12,18,24):</p>
  <p><input type="text" id="numbers" placeholder="12,18,24" /></p>
  <p>
    <button onclick="calculateLCM()">Calculate</button>
    <button id="copyBtn" onclick="copyResult()" disabled>Copy result</button>
  </p>

  <div id="tableContainer"></div>
  <div class="result" id="result"></div>

  <script>
    function gcd(a, b) {
      while (b !== 0) [a, b] = [b, a % b];
      return a;
    }

    function allPairwiseCoprime(arr) {
      for (let i = 0; i < arr.length; i++) {
        for (let j = i + 1; j < arr.length; j++) {
          if (gcd(arr[i], arr[j]) !== 1) return false;
        }
      }
      return true;
    }

    function calculateLCM() {
      const input = document.getElementById("numbers").value.trim();
      const tableDiv = document.getElementById("tableContainer");
      const resultDiv = document.getElementById("result");
      const copyBtn = document.getElementById("copyBtn");
      tableDiv.innerHTML = "";
      resultDiv.innerHTML = "";
      copyBtn.disabled = true;

      let numbers = input.split(",").map(n => parseInt(n.trim())).filter(n => !isNaN(n) && n > 0);
      if (numbers.length < 2) {
        tableDiv.innerHTML = '<p class="error">Please enter at least two positive integers.</p>';
        return;
      }

      const originalNumbers = [...numbers];
      let factor = 2;
      let tableRows = [];
      let factorList = [];

      while (!allPairwiseCoprime(numbers)) {
        let divisibleCount = numbers.filter(n => n % factor === 0).length;
        if (divisibleCount >= 2) {
          let newRow = [factor];
          numbers = numbers.map(n => {
            let result = n % factor === 0 ? n / factor : n;
            newRow.push(result);
            return result;
          });
          tableRows.push(newRow);
          factorList.push(factor);
        } else {
          factor++;
        }
      }

      // Create table
      const table = document.createElement("table");
      // Header row
      const headerRow = document.createElement("tr");
      const thFactor = document.createElement("th");
      thFactor.textContent = "Factor";
      headerRow.appendChild(thFactor);
      originalNumbers.forEach((num, idx) => {
        const th = document.createElement("th");
        const nextFactor = factorList[0];
        if (nextFactor && num % nextFactor === 0) {
          th.innerHTML = `<strong>${num}</strong>`;
        } else {
          th.textContent = num;
        }
        headerRow.appendChild(th);
      });
      table.appendChild(headerRow);

      // Data rows
      tableRows.forEach((row, rowIndex) => {
        const tr = document.createElement("tr");
        const nextFactor = factorList[rowIndex + 1] || null;
        row.forEach((cell, colIndex) => {
          const td = document.createElement("td");
          if (colIndex > 0 && nextFactor && cell % nextFactor === 0) {
            td.innerHTML = `<strong>${cell}</strong>`;
          } else {
            td.textContent = cell;
          }
          tr.appendChild(td);
        });
        table.appendChild(tr);
      });

      tableDiv.appendChild(table);

      // Compute LCM and show result
      const remainingProduct = numbers.reduce((a, b) => a * b, 1);
      const factorProduct = factorList.reduce((a, b) => a * b, 1);
      const lcm = remainingProduct * factorProduct;
      const allFactorsStr = [...factorList, ...numbers].join(' × ');
      resultDiv.innerHTML = `LCM = ${allFactorsStr} = <strong>${lcm}</strong>`;
      copyBtn.disabled = false;
    }

    function copyResult() {
      const resultText = document.getElementById("result").innerText;
      navigator.clipboard.writeText(resultText).then(() => {
        const btn = document.getElementById("copyBtn");
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = 'Copy result', 2000);
      });
    }
  </script>
</body>
